AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Intelligent S3 file renaming serverless stack.

Parameters:
  StageName:
    Type: String
    Default: dev
  InputBucketName:
    Type: String
    Default: file-renaming-input-dev
  FrontendBucketName:
    Type: String
    Default: file-renaming-frontend-dev

Globals:
  Function:
    Runtime: java17
    MemorySize: 1024
    Timeout: 30
    Tracing: Active
    Environment:
      Variables:
        S3_BUCKET_NAME: !Ref InputBucket
        RULES_TABLE_NAME: !Ref RulesTable
        BATCHES_TABLE_NAME: !Ref BatchesTable
        RESULTS_TABLE_NAME: !Ref ResultsTable
        APP_STORAGE_ADAPTER: s3
        APP_PERSISTENCE_ADAPTER: dynamodb
        STAGE_NAME: !Ref StageName

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName

  BackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub s3-renaming-backend-${StageName}
      Handler: com.example.s3renaming.LambdaHandler::handleRequest
      CodeUri: ../../backend/target/s3-renaming-backend-0.1.0-aws.jar
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref InputBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref RulesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BatchesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable
      Events:
        ProxyApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
            PayloadFormatVersion: '1.0'

  InputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref InputBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  RulesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub file-renaming-rules-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ruleId
          AttributeType: S
        - AttributeName: version
          AttributeType: N
      KeySchema:
        - AttributeName: ruleId
          KeyType: HASH
        - AttributeName: version
          KeyType: RANGE

  BatchesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub file-renaming-batches-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: batchId
          AttributeType: S
      KeySchema:
        - AttributeName: batchId
          KeyType: HASH

  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub file-renaming-results-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: batchId
          AttributeType: S
        - AttributeName: resultId
          AttributeType: S
      KeySchema:
        - AttributeName: batchId
          KeyType: HASH
        - AttributeName: resultId
          KeyType: RANGE

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref FrontendBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub s3-renaming-frontend-oac-${StageName}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !Ref FrontendOriginAccessControl
          - Id: BackendApiOrigin
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
            OriginPath: !Sub /${StageName}
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: BackendApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            ForwardedValues:
              QueryString: true
              Headers:
                - Authorization
                - Content-Type
              Cookies:
                Forward: all
            MinTTL: 0
            DefaultTTL: 0
            MaxTTL: 0

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

Outputs:
  ApiUrl:
    Description: Backend HTTP API URL.
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
  HttpApiId:
    Description: HTTP API id.
    Value: !Ref HttpApi
  InputBucket:
    Description: Input S3 bucket.
    Value: !Ref InputBucket
  FrontendBucket:
    Description: Frontend S3 bucket.
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Description: CloudFront distribution id.
    Value: !Ref FrontendDistribution
  FrontendDistributionDomain:
    Description: CloudFront domain for frontend.
    Value: !GetAtt FrontendDistribution.DomainName
