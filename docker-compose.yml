services:
  localstack:
    image: localstack/localstack:3.8.1
    container_name: s3-renaming-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,dynamodb,sqs
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
    volumes:
      - "./infrastructure/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro"
      - "./data/samples:/opt/bootstrap/data:ro"
      - "localstack-data:/var/lib/localstack"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    container_name: s3-renaming-backend
    ports:
      - "8080:8080"
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET_NAME: file-renaming-input-local
      RULES_TABLE_NAME: file-renaming-rules-local
      BATCHES_TABLE_NAME: file-renaming-batches-local
      RESULTS_TABLE_NAME: file-renaming-results-local
      APP_STORAGE_ADAPTER: s3
      APP_PERSISTENCE_ADAPTER: dynamodb
    depends_on:
      localstack:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: s3-renaming-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  localstack-data:

